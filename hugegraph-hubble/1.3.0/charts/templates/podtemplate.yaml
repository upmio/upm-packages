apiVersion: v1
kind: PodTemplate
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    upm.io/owner: upm
    type: hugegraph-hubble
    version: {{ .Chart.AppVersion | quote }}
template:
  metadata:
    annotations:
      kubectl.kubernetes.io/default-container: hugegraph-hubble
    labels:
      type: hugegraph-hubble
      version: {{ .Chart.AppVersion | quote }}
  spec:
    dnsPolicy: ClusterFirst
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    securityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    initContainers:
      - name: init-container
        image: {{ include "hugegraph-hubble.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
        command: ["bash", "-c", "service-ctl.sh initialize"]
        env:
          - name: DATA_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.data.mountPath']"
          - name: LOG_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.log.mountPath']"
          - name: DATA_DIR
            value: "$(DATA_MOUNT)/data"
          - name: CONF_DIR
            value: "$(DATA_MOUNT)/conf"
          - name: CONFIG_PATH
            value: "$(DATA_MOUNT)/conf/hugegraph-hubble.properties"
          - name: HUBBLE_PORT
            value: "8088"
    containers:
      - name: hugegraph-hubble
        image: {{ include "hugegraph-hubble.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
        ports:
          - name: hubble
            containerPort: 8088
        env:
          - name: DATA_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.data.mountPath']"
          - name: LOG_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.log.mountPath']"
          - name: DATA_DIR
            value: "$(DATA_MOUNT)/data"
          - name: CONF_DIR
            value: "$(DATA_MOUNT)/conf"
          - name: CONFIG_PATH
            value: "$(DATA_MOUNT)/conf/hugegraph-hubble.properties"
          - name: HUBBLE_PORT
            value: "8088"
        livenessProbe:
          exec:
            command: ["bash", "-c", "</dev/tcp/127.0.0.1/9001"]
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["bash", "-c", "service-ctl.sh health"]
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 4
          failureThreshold: 4
        startupProbe:
          exec:
            command: ["bash", "-c", "</dev/tcp/127.0.0.1/9001"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      - name: unit-agent
        image: {{ include "hugegraph-hubble.agent.image" . }}
        imagePullPolicy: {{ .Values.agent.image.pullPolicy | quote }}
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
        ports:
          - name: unit-agent
            containerPort: 2214
        env:
          - name: UNIT_TYPE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['kubectl.kubernetes.io/default-container']"
          - name: DATA_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.data.mountPath']"
          - name: LOG_MOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: "metadata.annotations['unit-operator/storage.volume.log.mountPath']"
          - name: DATA_DIR
            value: "$(DATA_MOUNT)/data"
          - name: CONF_DIR
            value: "$(DATA_MOUNT)/conf"
          - name: CONFIG_PATH
            value: "$(DATA_MOUNT)/conf/hugegraph-hubble.properties"
          - name: AES_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: aes-secret-key
                key: AES_SECRET_KEY
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: HUBBLE_HOST
            value: "127.0.0.1"
          - name: HUBBLE_PORT
            value: "8088"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
